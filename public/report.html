<!DOCTYPE html>
<html>
<head>
  <title>Verification Report</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 32px 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h1 {
      margin-top: 0;
    }

    .meta {
      color: #555;
      margin-bottom: 24px;
    }

    .finding {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .error {
      color: #b42318;
      background: #fee4e2;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="content">Loading report...</div>
  </div>

  <script>
    async function loadReport() {
      const token = window.location.pathname.split('/').pop();
      const content = document.getElementById('content');

      try {
        const response = await fetch(`/api/report/verify/${token}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Unable to load report');
        }

        const findings = (data.reportContent.findings || []).map((finding) => `
          <div class="finding">
            <strong>${finding.category || 'Finding'}</strong>
            <p>${finding.result || 'No result provided.'}</p>
            <small>Confidence: ${finding.confidence ?? 'N/A'}</small>
          </div>
        `).join('');

        content.innerHTML = `
          <h1>${data.reportContent.title || 'Verification Report'}</h1>
          <p>${data.reportContent.summary || 'No summary available.'}</p>
          <div class="meta">
            <div>Trust score: ${data.reportContent.trustScore ?? 'N/A'}</div>
            <div>Created: ${data.createdAt ? new Date(data.createdAt).toLocaleString() : 'N/A'}</div>
            <div>Expires: ${data.expiresAt ? new Date(data.expiresAt).toLocaleString() : 'No expiry'}</div>
          </div>
          <div>${findings || '<p>No findings recorded.</p>'}</div>
        `;
      } catch (error) {
        content.innerHTML = `<div class="error">${error.message}</div>`;
      }
    }

    loadReport();
  </script>
</body>
</html>
